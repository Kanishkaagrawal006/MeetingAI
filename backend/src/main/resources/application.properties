spring.application.name=meeting-summarizer
spring.datasource.url=jdbc:postgresql://localhost:5439/meetings
spring.datasource.username=meetings_user
spring.datasource.password=meetings_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
app.storage.location=uploads

springdoc.swagger-ui.path=/swagger-ui.html
app.aws.s3-bucket=${AWS_S3_BUCKET:meeting-summarizer-audio-kanishka}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-3.6-flash
app.openai.api-key=${OPENAI_API_KEY:}
app.azure.speech-key=${AZURE_SPEECH_KEY:}
app.azure.speech-region=${AZURE_SPEECH_REGION:}
app.azure.storage-connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.azure.storage-container=${AZURE_STORAGE_CONTAINER:meeting-audio}